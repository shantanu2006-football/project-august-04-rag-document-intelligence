[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ragdoc"
version = "0.1.0"
description = "Retrieval-augmented Q&A system over documents with a retrieval evaluation harness"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy==2.4.6",
    "scikit-learn==1.9.0",
    "faiss-cpu==1.15.0",
    "pypdf==6.16.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "fpdf2==2.8.8",
]

[project.scripts]
ragdoc = "ragdoc.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
